name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database. The suite builds its own schema (veribook_test) inside it on every run.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # No AI or embeddings keys in CI: the suites that call a provider are skipped (visibly in the
      # report), and every deterministic suite runs.
      SKIP_LIVE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Deterministic extraction benchmark; fails if any damaged document is let through unflagged.
      - run: npx tsx scripts/eval.ts   # not `npm run eval`: that script passes --env-file=.env, and CI has no .env file

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
